<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fußballrechner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="nav-hist"><button type="button" id="navBack" class="nav-arrow" aria-label="Zurück" title="Zurück" disabled>‹</button><button type="button" id="navFwd" class="nav-arrow" aria-label="Vorwärts" title="Vorwärts" disabled>›</button></span>Fußballrechner</div>
    <nav id="leagueNav" class="topnav"></nav>
    <div class="top-tools">
      <button type="button" class="nav-menu-btn" data-menu="spielstand">Spielstand</button>
      <div class="nav-drop">
        <div class="side-tools">
          <button id="btnExport" class="btn small">Spielstand exportieren</button>
          <label class="btn small">Spielstand importieren<input type="file" id="fileImport" accept=".json,application/json" hidden></label>
          <button id="btnReset" class="btn small danger">Alles zurücksetzen</button>
        </div>
      </div>
    </div>
    <div id="headActions" class="head-actions"></div>
    <label class="season-field">Saison <select id="seasonSelect" title="Saison"></select></label>
  </header>
  <main id="main">
    <div class="mobile-nav"><select id="mobileLeague"></select></div>
    <header class="head">
      <div class="head-main">
        <h1 id="title">Fußballrechner</h1>
        <div id="subline" class="subline"></div>
      </div>
    </header>
    <nav id="tabs" class="tabs"></nav>
    <section id="view"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="modal-close" id="modalClose" title="Schließen">×</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="data.js"></script>
<script src="koordinaten.js"></script>
<script src="bundeslaender.js"></script>
<script src="ansehen.js"></script>
<script src="titel.js"></script>
<script src="titel-schau.js"></script>
<script src="titel-offen.js"></script>
<script src="app.js"></script>
</body>
</html>
