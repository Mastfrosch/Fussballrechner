<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fußballrechner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">⚽ Fußballrechner</div>
    <nav id="leagueNav"></nav>
    <div class="side-tools">
      <button id="btnExport" class="btn small">Spielstand exportieren</button>
      <label class="btn small">Spielstand importieren<input type="file" id="fileImport" accept=".json,application/json" hidden></label>
      <button id="btnReset" class="btn small danger">Alles zurücksetzen</button>
    </div>
  </aside>
  <main id="main">
    <div class="mobile-nav"><select id="mobileLeague"></select></div>
    <header class="head">
      <h1 id="title">Fußballrechner</h1>
      <div class="head-right">
        <select id="seasonSelect" title="Saison"></select>
      </div>
    </header>
    <div id="subline" class="subline"></div>
    <nav id="tabs" class="tabs"></nav>
    <section id="view"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="modal-close" id="modalClose" title="Schließen">×</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast hidden"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
